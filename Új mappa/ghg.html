    <style>

        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Emeletválasztó */

        .floors {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .floor-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .floor-button:hover {
            background: #dbeafe;
        }

        .floor-button.active {
            background: #2563eb;

        /* Térkép */

        .map-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .map {
            min-width: 800px;
            height: 450px;
            position: relative;
            border: 4px solid #64748b;
            background: #f8fafc;
        }

        /* Termek */

        .room {
            position: absolute;
            border: 2px solid #475569;
            background: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .room:hover {
            background: #bfdbfe;
            transform: scale(1.02);
        }

        .room.selected {
            background: #93c5fd;
            border-color: #2563eb;
        }

        /* Folyosó */

        .corridor {
            position: absolute;

            display: flex;
            align-items: center;

    </style>
</head>

    /*
        Megjeleníti a kiválasztott emeletet.
    */

    function showFloor(floorNumber) {

        const map = document.getElementById("map");

        map.innerHTML = "";


        /*
            Emeletgombok állapotának frissítése
        */

        const buttons =
            document.querySelectorAll(".floor-button");

        buttons.forEach(function(button, index) {

            if (index + 1 === floorNumber) {

                button.classList.add("active");

            } else {

                button.classList.remove("active");

            }

        });


        /*
            Termek létrehozása
        */

        floors[floorNumber].forEach(function(room) {

            const roomElement =
                document.createElement("div");

            roomElement.classList.add("room");


            /*
                A terem pozíciója
            */

            roomElement.style.left =
                room.x + "px";

            roomElement.style.top =
                room.y + "px";

            roomElement.style.width =
                room.width + "px";

            roomElement.style.height =
                room.height + "px";


            /*
                Terem neve
            */

            roomElement.textContent =
                room.name;


            /*
                Kattintás esemény
            */

            roomElement.onclick = function() {

                selectRoom(
                    roomElement,
                    room
                );

            };


            map.appendChild(roomElement);

        });

    }


    /*
        Terem kiválasztása
    */

    function selectRoom(element, room) {

        /*
            Előző kijelölés megszüntetése
        */

        document
            .querySelectorAll(".room")
            .forEach(function(roomElement) {

                roomElement.classList.remove("selected");

            });


        /*
            Új terem kijelölése
        */

        element.classList.add("selected");


        /*
            Információ megjelenítése
        */

        document.getElementById("roomName")
            .textContent =
            "Terem: " + room.name;


        document.getElementById("roomDescription")
            .textContent =
            room.description;

    }


    /*
        Alapértelmezésként
        a földszint jelenik meg.
    */
